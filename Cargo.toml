[package]
name = "embedded-sdmmc-async-panic-on-drop"
version = "0.1.1"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

defmt = "0.3.10"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.4.0", features = ["defmt", "time-driver", "rp2040"] }

embedded-sdmmc = { git = "https://github.com/Be-ing/embedded-sdmmc-rs", rev = "7b15cf594ed038df271ad47e2bfc11277defe731", default-features = false }
embassy-embedded-hal = "0.3.0"
embassy-sync = "0.6.2"

[profile.release]
lto = true
opt-level = 3
incremental = false
codegen-units = 1
debug = true
